name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  lint:
    name: clang-format check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Detect C sources
        id: sources
        run: |
          FOUND=$(find . -type f \( -name '*.c' -o -name '*.h' \) \
            -not -path './build*/*' -not -path './.git/*' | wc -l)
          echo "count=$FOUND" >> "$GITHUB_OUTPUT"
      - name: Check formatting
        if: steps.sources.outputs.count != '0'
        run: |
          find . -type f \( -name '*.c' -o -name '*.h' \) \
            -not -path './build*/*' -not -path './.git/*' -print0 \
            | xargs -0 -r clang-format --dry-run --Werror
      - name: Skip notice
        if: steps.sources.outputs.count == '0'
        run: echo "No C sources yet, skipping clang-format."

  build-matrix:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-22.04
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]
        build_type: [ Debug, Release ]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y gcc g++
          else
            sudo apt-get install -y clang lld
          fi
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang
      - name: Configure with sanitizers
        env:
          CC: clang
        run: |
          cmake -S . -B build-san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -g -O1"
      - name: Build
        run: cmake --build build-san
      - name: Test under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-san --output-on-failure

  valgrind:
    name: Valgrind memcheck
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build valgrind gcc
      - name: Configure
        env:
          CC: gcc
        run: |
          cmake -S . -B build-vg -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-g -O0" \
            -DMEMORYCHECK_COMMAND=/usr/bin/valgrind \
            -DMEMORYCHECK_COMMAND_OPTIONS="--leak-check=full --error-exitcode=1 --errors-for-leak-kinds=definite,indirect --track-origins=yes"
      - name: Build
        run: cmake --build build-vg
      - name: Run tests under Valgrind
        run: ctest --test-dir build-vg --output-on-failure -T memcheck

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc gcovr lcov
      - name: Configure
        env:
          CC: gcc
        run: |
          cmake -S . -B build-cov -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage -O0 -g"
      - name: Build
        run: cmake --build build-cov
      - name: Test
        run: ctest --test-dir build-cov --output-on-failure
      - name: Generate coverage report
        run: gcovr --root . --xml coverage.xml --html-details coverage.html build-cov
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.html
